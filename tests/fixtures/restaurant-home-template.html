<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" data-rubik-seo="robots" />
<meta property="og:title" content="Placeholder" data-rubik-seo="og-title" />
<meta name="twitter:card" content="summary_large_image" data-rubik-seo="twitter-card" />
<script type="application/ld+json" data-rubik-seo="schema">{}</script>
<meta name="description" content="Placeholder" data-rubik-seo="description" />
<title data-rubik-seo="title">Placeholder</title>
</head>
<!-- Test fixture: minimal slot structure of the Restaurantes Premium HOME template
     (index.html @ WEB-RESTAURACI-N-PREMIUM-DIN-MICA 388e48a). It keeps only the
     elements painted by hosts/restaurant/restaurant-host.cjs, not the product UI. -->
<body>
<main>
<section class="hero" aria-label="Presentación">
  <div class="hero-media parallax" data-media-host="hero"></div>
  <p id="hero-kicker" class="kicker"></p>
  <h1 class="display split-reveal"><span id="hero-line1"></span> <em id="hero-line2"></em></h1>
  <p id="hero-body"></p>
  <a href="#visit"><span id="hero-cta"></span></a>
  <span id="hero-stamp"></span>
  <div id="scroll-hint" class="scroll-hint"></div>
</section>
<section>
  <p id="philosophy-index" class="section-no"></p>
  <h2 id="philosophy-title" class="display reveal-lines"></h2>
  <p id="philosophy-body1"></p>
  <p id="philosophy-body2"></p>
</section>
<section>
  <p id="orbital-index" class="section-no light"></p>
  <p id="orbital-kicker" class="kicker"></p>
  <h2 id="orbital-title" class="display"></h2>
  <div class="orbit-shell" tabindex="0" aria-label="Menú orbital.">
    <div id="orbit-stage" class="orbit-stage"></div>
  </div>
  <p id="dish-meta" class="kicker"></p>
  <h3 id="dish-title" class="display"></h3>
  <p id="dish-short"></p>
  <button id="explore-dish" class="explore" type="button"><span id="explore-label"></span></button>
  <span id="dish-counter"></span>
</section>
<section>
  <p id="origin-index" class="section-no"></p>
  <h2 id="origin-title" class="display"></h2>
  <p id="origin-body"></p>
  <div data-media-host="origin" class="media-host-fill"></div>
  <div id="origin-caption" class="media-label"></div>
</section>
<section>
  <p id="atmosphere-index" class="section-no light"></p>
  <h2 id="atmosphere-title" class="display"></h2>
  <div data-media-host="atmosphere" class="media-host-fill"></div>
  <figure><figcaption id="atmosphere-caption"></figcaption></figure>
  <p id="atmosphere-body"></p>
  <button id="atmosphere-cta" class="reserve-open text-button" type="button"></button>
</section>
<section>
  <div data-media-host="chef" class="media-host-fill"></div>
  <p id="chef-index" class="section-no light"></p>
  <h2 id="chef-title" class="display"></h2>
  <p id="chef-quote"></p>
  <div id="chef-badges" class="chef-meta"></div>
</section>
<section class="reserve-banner" id="visit">
  <p id="visit-kicker" class="kicker dark"></p>
  <h2 id="visit-title" class="display"></h2>
  <button id="visit-cta" class="reserve-open reserve-dark" type="button"></button>
  <span id="address-label"></span><p id="address-text"></p>
  <span id="service-label"></span><p id="service-text"></p>
  <span id="contact-label"></span><p id="contact-text"></p>
</section>
</main>
<footer><strong id="footer-left"></strong><span id="footer-center"></span><span id="footer-right"></span></footer>
</body>
</html>
